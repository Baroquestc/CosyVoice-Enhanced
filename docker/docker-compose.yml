services:
  cosyvoice-api:
    build:
      context: ..  # Build context is project root
      dockerfile: docker/Dockerfile  # Dockerfile path relative to context
    image: cosyvoice-api:latest
    container_name: cosyvoice-api-server
    restart: unless-stopped
    # 2. 添加下面这行，让容器启动后永久睡眠
    # command: ["/bin/bash", "-c", "sleep infinity"] 
    # GPU support for CUDA and VLLM acceleration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    # Environment variables (can be overridden via .env file)
    environment:
      # Model Configuration
      - MODEL_DIR=${MODEL_DIR:-pretrained_models/CosyVoice2-0.5B}
      
      # Performance Options
      - LOAD_JIT=${LOAD_JIT:-}
      - LOAD_TRT=${LOAD_TRT:-}
      - FP16=${FP16:-}
      
      # VLLM Configuration
      - LOAD_VLLM=${LOAD_VLLM:-}
      - NO_AUTO_VLLM=${NO_AUTO_VLLM:-}
      
      # CUDA Configuration
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-all}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    
    # Volume mappings
    volumes:
      # Model files - IMPORTANT: Update this path to your actual model directory
      - ${MODELS_PATH:-../pretrained_models}:/workspace/CosyVoice/pretrained_models
      
      # Logs and temporary files
      - ${LOGS_PATH:-../logs}:/workspace/CosyVoice/logs
      - ${TMP_PATH:-../tmp}:/workspace/CosyVoice/tmp
      
      # Optional: Custom configuration
      - ${CONFIG_PATH:-../config}:/workspace/CosyVoice/config
    
    # Port mapping - Fixed to 9996 as per container default
    ports:
      - "${API_PORT:-9996}:9996"
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9996/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Network configuration
    networks:
      - cosyvoice-network

# Network definition
networks:
  cosyvoice-network:
    driver: bridge
    
# Optional: Shared volumes for data persistence
volumes:
  cosyvoice-logs:
    driver: local
  cosyvoice-tmp:
    driver: local